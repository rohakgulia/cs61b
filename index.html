}

<body>
<div class="hdr">
  <div class="site-title">CS 61B // Sorting Algorithms</div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="main" id="main"></div>

<script>
/* ══════════════════════════════════════════════════════════
   STEP FORMAT: { array: [...], hl: { idx: state }, msg: '' }
   States: default | scan | compare | swap | sorted | pivot | active | bucket
══════════════════════════════════════════════════════════ */
function s(arr, hl, msg, meta){
  const o={ array:[...arr], hl:{...hl}, msg }
  if(meta) Object.assign(o, meta)
  return o
}
function baseHL(sortedSet){ const h={}; sortedSet.forEach(k=>{ h[k]='sorted' }); return h }

// ── Selection Sort ──────────────────────────────────────
function genSelection(init){
  const a=[...init],n=a.length,S=[],sorted=new Set()
  for(let i=0;i<n-1;i++){
    let mi=i
    for(let j=i+1;j<n;j++){
      const h=baseHL(sorted); h[i]='active'; h[mi]='compare'; h[j]='scan'
      S.push(s(a,h,`Find min from [${i}]: ${a[j]} vs current min ${a[mi]}`))
      if(a[j]<a[mi]) mi=j
    }
    if(mi!==i){
      const h=baseHL(sorted); h[i]='swap'; h[mi]='swap'
      S.push(s(a,h,`Swap ${a[i]} ↔ ${a[mi]}`))
      ;[a[i],a[mi]]=[a[mi],a[i]]
    }
    sorted.add(i)
    S.push(s(a,baseHL(sorted),`${a[i]} is in its final position [${i}]`))
  }
  sorted.add(n-1)
  S.push(s(a,baseHL(sorted),'Array sorted ✓'))
  return S
}

// ── Insertion Sort ──────────────────────────────────────
function genInsertion(init){
  const a=[...init],n=a.length,S=[]
  S.push(s(a,{0:'sorted'},'Single element is trivially sorted'))
  for(let i=1;i<n;i++){
    let j=i
    const h={}; for(let k=0;k<i;k++) h[k]='sorted'; h[i]='active'
    S.push(s(a,h,`Inserting ${a[i]} into sorted prefix [0..${i-1}]`))
    while(j>0 && a[j-1]>a[j]){
      S.push(s(a,{[j]:'compare',[j-1]:'compare'},`${a[j-1]} > ${a[j]}: swap left`))
      ;[a[j],a[j-1]]=[a[j-1],a[j]]
      S.push(s(a,{[j]:'swap',[j-1]:'swap'},`Swapped → ${a[j-1]} now at [${j-1}]`))
      j--
    }
    const h2={}; for(let k=0;k<=i;k++) h2[k]='sorted'
    S.push(s(a,h2,`${a[j]} settled at [${j}]`))
  }
  const hf={}; for(let i=0;i<n;i++) hf[i]='sorted'
  S.push(s(a,hf,'Array sorted ✓'))
  return S
}

// ── Merge Sort ──────────────────────────────────────────
function genMerge(init){
  const a=[...init],n=a.length,S=[]
  function ms(l,r){
    if(l>=r){ S.push(s(a,{[l]:'sorted'},`Base case [${l}]`)); return }
    const mid=(l+r)>>1
    const h={}; for(let i=l;i<=r;i++) h[i]='active'
    S.push(s(a,h,`Split [${l}..${r}] → [${l}..${mid}] | [${mid+1}..${r}]`))
    ms(l,mid); ms(mid+1,r); merge(l,mid,r)
  }
  function merge(l,m,r){
    const L=a.slice(l,m+1),R=a.slice(m+1,r+1)
    let i=0,j=0,k=l
    while(i<L.length && j<R.length){
      const h={}; for(let x=k;x<=r;x++) h[x]='active'
      S.push(s(a,h,`Merge [${l}..${r}]: comparing ${L[i]} vs ${R[j]}`))
      if(L[i]<=R[j]) a[k++]=L[i++]; else a[k++]=R[j++]
    }
    while(i<L.length) a[k++]=L[i++]
    while(j<R.length) a[k++]=R[j++]
    const hf={}; for(let x=l;x<=r;x++) hf[x]='sorted'
    S.push(s(a,hf,`Merged [${l}..${r}]`))
  }
  ms(0,n-1)
  const hf={}; for(let i=0;i<n;i++) hf[i]='sorted'
  S.push(s(a,hf,'Array sorted ✓'))
  return S
}

// ── Heap Sort ───────────────────────────────────────────
function genHeap(init){
  const a=[...init],n=a.length,S=[]
  function sink(k,sz){
    while(2*k+1<sz){
      const L=2*k+1, R=2*k+2
      let c
      if(R<sz){
        S.push(s(a,{[L]:'compare',[R]:'compare'},`Compare both children: [${L}]=${a[L]} vs [${R}]=${a[R]} → larger at [${a[R]>a[L]?R:L}]`,{heapSize:sz}))
        c=a[R]>a[L]?R:L
      } else {
        c=L
      }
      const ok=a[k]>=a[c]
      S.push(s(a,{[k]:'compare',[c]:'compare'},ok
        ?`Parent [${k}]=${a[k]} ≥ child [${c}]=${a[c]} — heap property holds (vs larger child), stop sinking`
        :`Parent [${k}]=${a[k]} < child [${c}]=${a[c]} — violates heap, swap downward`,{heapSize:sz}))
      if(ok) break
      S.push(s(a,{[k]:'swap',[c]:'swap'},`Sink: swap parent [${k}] with child [${c}]`,{heapSize:sz}))
      ;[a[k],a[c]]=[a[c],a[k]]
      S.push(s(a,{[k]:'swap',[c]:'swap'},`Sank → ${a[c]} now at [${c}]`,{heapSize:sz}))
      k=c
    }
  }
  const firstLeaf=Math.floor(n/2), lastInternal=Math.floor(n/2)-1
  S.push(s(a,{},`Phase 1: bottom-up heapify. Indices ${firstLeaf}…${n-1} are leaves (no children, so no sink). Heapify starts at the last internal node [${lastInternal}] — not the rightmost leaf [${n-1}] — then works left to [0].`,{heapSize:n}))
  for(let k=lastInternal;k>=0;k--){
    const label=k===lastInternal
      ?`Sink from [${k}] = ${a[k]} — first call is at the rightmost internal node (parent of leaf [${n-1}], etc.), not at a leaf`
      :`Sink node [${k}] = ${a[k]}`
    S.push(s(a,{[k]:'active'},label,{heapSize:n}))
    sink(k,n)
  }
  const ph={}; for(let i=0;i<n;i++) ph[i]='pivot'
  S.push(s(a,ph,`Max-heap built. Root ${a[0]} is the maximum.`,{heapSize:n}))
  S.push(s(a,{},'Phase 2: extract-max to sorted suffix',{heapSize:n}))
  const sorted=new Set()
  for(let end=n-1;end>0;end--){
    const h=baseHL(sorted); h[0]='active'; h[end]='swap'
    S.push(s(a,h,`Swap root ${a[0]} ↔ last heap item ${a[end]}`,{heapSize:end+1}))
    ;[a[0],a[end]]=[a[end],a[0]]
    sorted.add(end)
    S.push(s(a,baseHL(sorted),`${a[end]} placed at final position [${end}]`,{heapSize:end}))
    sink(0,end)
  }
  sorted.add(0)
  S.push(s(a,baseHL(sorted),'Array sorted ✓',{heapSize:0}))
  return S
}

// ── Quick Sort (Hoare partition) ────────────────────────
function genQuick(init){
  const a=[...init],n=a.length,S=[],sorted=new Set()
  function qs(lo,hi){
    if(lo>=hi){ if(lo===hi) sorted.add(lo); return }
    const pivIdx=(lo+hi)>>1,piv=a[pivIdx]
    ;[a[lo],a[pivIdx]]=[a[pivIdx],a[lo]]
    const h0=baseHL(sorted)
    for(let x=lo;x<=hi;x++) if(!sorted.has(x)) h0[x]='active'
    h0[lo]='pivot'
    if(lo+1<hi){
      h0[lo+1]='ptrL'; h0[hi]='ptrR'
    } else if(lo+1===hi){
      h0[lo+1]='ptrL'
    }
    S.push(s(a,h0,`Partition [${lo}..${hi}]: pivot value ${piv} at [${lo}]. L→ starts [${lo+1}], R← starts [${hi}] — L wants smaller-than-pivot, R wants larger-than-pivot; they walk toward each other.`))
    let l=lo+1,r=hi
    while(l<=r){
      while(l<=r && a[l]<piv){
        const h=baseHL(sorted); h[lo]='pivot'; h[l]='ptrL'; if(l!==r) h[r]='ptrR'
        S.push(s(a,h,`L@${l}: a[${l}]=${a[l]} < ${piv} ✓ (L loves small) → advance L right.`))
        l++
      }
      if(l>r) break
      const hL=baseHL(sorted); hL[lo]='pivot'; hL[l]='ptrL'; hL[r]='ptrR'
      S.push(s(a,hL,`L@${l} stopped: a[${l}]=${a[l]} is not < pivot (≥${piv}). R@${r} at a[${r}]=${a[r]}. R walks next (loves large).`))

      while(l<=r && a[r]>piv){
        const h=baseHL(sorted); h[lo]='pivot'; h[l]='ptrL'; h[r]='ptrR'
        S.push(s(a,h,`R@${r}: a[${r}]=${a[r]} > ${piv} ✓ (R loves large) → advance R left.`))
        r--
      }
      if(l>r) break
      const hR=baseHL(sorted); hR[lo]='pivot'; hR[l]='ptrL'; hR[r]='ptrR'
      S.push(s(a,hR,`R@${r} stopped: a[${r}]=${a[r]} is not > pivot (≤${piv}). L@${l} & R@${r} both stopped — swap what they’re on.`))

      if(l<r){
        const h=baseHL(sorted); h[lo]='pivot'; h[l]='swap'; h[r]='swap'
        S.push(s(a,h,`Swap a[${l}]=${a[l]} ↔ a[${r}]=${a[r]}; then keep walking inward.`))
        ;[a[l],a[r]]=[a[r],a[l]]; l++; r--
      } else if(l===r) l++
    }
    const h=baseHL(sorted); h[lo]='swap'; h[r]='swap'
    S.push(s(a,h,`Pointers crossed (L past R): final Hoare step — swap pivot at [${lo}] with a[${r}]=${a[r]} (R's resting index).`))
    ;[a[lo],a[r]]=[a[r],a[lo]]
    sorted.add(r)
    S.push(s(a,baseHL(sorted),`Pivot ${piv} is in final position [${r}]`))
    qs(lo,r-1); qs(r+1,hi)
  }
  qs(0,n-1)
  const hf={}; for(let i=0;i<n;i++) hf[i]='sorted'
  S.push(s(a,hf,'Array sorted ✓'))
  return S
}

// ── Counting Sort ───────────────────────────────────────
function genCounting(init){
  const a=[...init],n=a.length,S=[]
  const R=Math.max(...a)+1
  S.push(s(a,{},`Counting sort: keys in [0..${R-1}], R=${R}`))
  const counts=new Array(R).fill(0)
  for(let i=0;i<n;i++){
    counts[a[i]]++
    S.push(s(a,{[i]:'bucket'},`a[${i}]=${a[i]}: counts[${a[i]}]++ → ${counts[a[i]]}`))
  }
  S.push(s(a,{},`counts = [${counts.join(', ')}]`))
  const start=[0]
  for(let r=0;r<R-1;r++) start.push(start[r]+counts[r])
  S.push(s(a,{},`start positions: {${start.map((v,i)=>`${i}→${v}`).join(', ')}}`))
  const out=new Array(n),next=[...start]
  for(let i=0;i<n;i++){
    const k=a[i]
    S.push(s(a,{[i]:'active'},`Place ${a[i]} (key ${k}) → out[${next[k]}]`))
    out[next[k]++]=a[i]
  }
  const hm={}; for(let i=0;i<n;i++) hm[i]='active'
  S.push(s(out,hm,'Output array assembled from counts'))
  const hf={}; for(let i=0;i<n;i++) hf[i]='sorted'
  S.push(s(out,hf,'Sorted ✓  Θ(N+R) time & space'))
  return S
}

// ── LSD Radix Sort ──────────────────────────────────────
function genLSD(init){
  const a=[...init],n=a.length,S=[]
  const W=2
  S.push(s(a,{},`LSD Radix Sort: W=${W} passes (least → most significant digit)`))
  for(let d=0;d<W;d++){
    const place=Math.pow(10,d),label=d===0?'ones':'tens'
    S.push(s(a,{},`── Pass ${d+1}/${W}: stable sort by ${label}-digit ──`))
    const counts=new Array(10).fill(0)
    for(let i=0;i<n;i++){
      const dig=Math.floor(a[i]/place)%10; counts[dig]++
      S.push(s(a,{[i]:'bucket'},`a[${i}]=${a[i]}, ${label}-digit=${dig}: count[${dig}]=${counts[dig]}`))
    }
    const next=[0]; for(let r=0;r<9;r++) next.push(next[r]+counts[r])
    const out=new Array(n)
    for(let i=0;i<n;i++){
      const dig=Math.floor(a[i]/place)%10
      S.push(s(a,{[i]:'active'},`Placing ${a[i]} (${label}-digit=${dig}) → out[${next[dig]}]`))
      out[next[dig]++]=a[i]
    }
    for(let i=0;i<n;i++) a[i]=out[i]
    const h={}; for(let i=0;i<n;i++) h[i]='active'
    S.push(s(a,h,`After pass ${d+1}: sorted by ${label}s digit`))
  }
  const hf={}; for(let i=0;i<n;i++) hf[i]='sorted'
  S.push(s(a,hf,'Sorted ✓  Stability preserved relative order across all passes.'))
  return S
}

// ── MSD Radix (strings) ─────────────────────────────────
function genMSD(init){
  const a=[...init], S=[]
  function keyAt(s,d){ return d<s.length?s.charCodeAt(d):0 }
  function sortRange(lo,hi,d){
    if(lo>=hi){
      const h={}; h[lo]='sorted'
      S.push(s(a,h,`Single string at [${lo}] — sorted within this subproblem.`,{msdDepth:d}))
      return
    }
    let k0=keyAt(a[lo],d), allSame=true
    for(let i=lo+1;i<=hi;i++){ if(keyAt(a[i],d)!==k0){ allSame=false; break } }
    if(allSame){
      if(k0===0){
        const h={}; for(let i=lo;i<=hi;i++) h[i]='sorted'
        S.push(s(a,h,`All strings end together here — tied on full keys; block [${lo}·${hi}] done.`,{msdDepth:d}))
        return
      }
      const h={}; for(let i=lo;i<=hi;i++) h[i]='active'
      S.push(s(a,h,`Same char '${String.fromCharCode(k0)}' at position ${d+1} for every row in [${lo}·${hi}] — recurse to next letter (still only this block).`,{msdDepth:d}))
      sortRange(lo,hi,d+1)
      return
    }
    const hA={}; for(let i=lo;i<=hi;i++) hA[i]='active'
    const intro=d===0
      ?`Whole array [${lo}·${hi}]: sort only by the first character. Strings sharing 'a' are grouped and handled together; don't compare them with strings starting with 'b' until this pass finishes.`
      :`Subproblem [${lo}·${hi}]: common prefix so far — compare only position ${d+1}. Ignore every index outside this range (other prefixes are separate subproblems).`
    S.push(s(a,hA,intro,{msdDepth:d}))
    const R=256, cnt=new Array(R).fill(0)
    for(let i=lo;i<=hi;i++) cnt[keyAt(a[i],d)]++
    const start=new Array(R)
    start[0]=0
    for(let c=1;c<R;c++) start[c]=start[c-1]+cnt[c-1]
    const next=[...start]
    const buf=a.slice(lo,hi+1)
    for(let i=0;i<buf.length;i++){
      const k=keyAt(buf[i],d)
      a[lo+next[k]++]=buf[i]
    }
    const hb={}; for(let i=lo;i<=hi;i++) hb[i]='bucket'
    S.push(s(a,hb,`Stable buckets at char #${d+1}: ${a.slice(lo,hi+1).map((s,j)=>'['+(lo+j)+']="'+s+'"').join(' · ')}`,{msdDepth:d}))
    let p=lo
    while(p<=hi){
      const k=keyAt(a[p],d)
      let q=p
      while(q+1<=hi && keyAt(a[q+1],d)===k) q++
      const label=k===0?'∅ (past end)':("'"+String.fromCharCode(k)+"'")
      if(p===q){
        const h1={}; h1[p]='sorted'
        S.push(s(a,h1,`Only one string with ${label} here — done.`,{msdDepth:d}))
      } else {
        const hr={}; for(let i=p;i<=q;i++) hr[i]='compare'
        S.push(s(a,hr,`Bucket ${label} → indices [${p}·${q}]: recursively sort these rows by the next character only.`,{msdDepth:d}))
        sortRange(p,q,d+1)
      }
      p=q+1
    }
  }
  S.push(s(a,{},'MSD radix (strings): start from the leftmost character. Each recursive call is a disjoint subproblem — e.g. compare all words starting with "a" among themselves before touching "b…" words.',{}))
  sortRange(0,a.length-1,0)
  const hf={}; for(let i=0;i<a.length;i++) hf[i]='sorted'
  S.push(s(a,hf,'Lexicographic order ✓',{msdDepth:null}))
  return S
}

/* ══════════════════════════════════════════════════════════
   ALGORITHM REGISTRY
══════════════════════════════════════════════════════════ */
const ALGOS = {
  selection:{
    name:'Selection',time:'Θ(N²)',space:'Θ(1)',stable:false,
    desc:'Find the minimum element, swap it to the front. Repeat for the remaining N−1 items. Always Θ(N²) — no early termination even if already sorted.',
    arr:()=>[9,3,7,1,11,5,8,2,10,4,6,12],gen:genSelection
  },
  insertion:{
    name:'Insertion',time:'Θ(N²) worst · Θ(N) best',space:'Θ(1)',stable:true,
    desc:'Walk each element left until it\'s in the right spot. Every swap eliminates one inversion. Θ(N) if nearly sorted. Fastest for small arrays (<15 items) — used as quicksort\'s base case.',
    arr:()=>[9,3,7,1,11,5,8,2,10,4,6,12],gen:genInsertion
  },
  merge:{
    name:'Merge',time:'Θ(N log N)',space:'Θ(N)',stable:true,
    desc:'Recursively split into halves, mergesort each, then merge in Θ(N). Θ(log N) levels × Θ(N) merge work = Θ(N log N) guaranteed. Costs Θ(N) auxiliary space for the merge step.',
    arr:()=>[9,3,7,1,11,5,8,2,10,4,6,12],gen:genMerge
  },
  heap:{
    name:'Heap',time:'Θ(N log N)',space:'Θ(1)',stable:false,
    desc:'Bottom-up heapify starts at index ⌊N/2⌋−1 (last internal node), not at leaves: leaves have no subtrees to fix. Then Phase 2 extracts the max at the root repeatedly. Θ(1) extra space; cache-unfriendly.',
    arr:()=>[9,3,7,1,11,5,8,2,10,4,6,12],gen:genHeap
  },
  quick:{
    name:'Quicksort',time:'Θ(N log N) avg · Θ(N²) worst',space:'Θ(log N)',stable:false,
    desc:'Hoare partition: L (left pointer) wants items smaller than the pivot; R wants larger. They walk toward each other and stop on values they “don’t like”; when both are stopped, swap. Repeat until L and R cross — then swap the pivot with R’s final index. Fastest in practice; worst case Θ(N²) if pivots are poor — random pivots help.',
    arr:()=>[9,3,7,1,11,5,8,2,10,4,6,12],gen:genQuick
  },
  counting:{
    name:'Counting',time:'Θ(N + R)',space:'Θ(N + R)',stable:true,
    desc:'Count occurrences of each key, compute start positions, scatter to output. Non-comparison sort — breaks the Θ(N log N) lower bound. Keys must be integers in a finite range [0, R).',
    arr:()=>[3,1,4,1,5,9,2,6,5,3,5],gen:genCounting
  },
  lsd:{
    name:'LSD Radix',time:'Θ(WN + WR)',space:'Θ(N + R)',stable:true,
    desc:'Sort digit-by-digit from least to most significant using a stable counting sort on each pass. W passes × Θ(N+R) per pass. Stability is essential: each pass must preserve the prior digit order.',
    arr:()=>[53,17,84,32,61,45,28,76,12,95,39,50],gen:genLSD
  },
  msd:{
    name:'MSD Radix',time:'Θ(N · L)',space:'Θ(N + R)',stable:true,
    desc:'Most-significant-character first: partition into buckets by the current column, recurse within each bucket. Each subproblem is independent — sort every "a…" word against other "a…" words before comparing across "b…". Sweeps the opposite direction from LSD (top-down instead of bottom-up by digit).',
    arr:()=>['axis','barn','ably','acid','bark','able'],gen:genMSD
  }
}

const COLORS = {
  default:'#1a3050',scan:'#1e5080',compare:'#b06820',swap:'#b02828',
  sorted:'#1a8040',pivot:'#6030b8',active:'#1858b0',bucket:'#a07818',
  ptrL:'#1a9e7a',ptrR:'#d4943c'
}
const LEGEND = [
  {state:'default',label:'Default'},{state:'active',label:'Region'},
  {state:'compare',label:'Comparing'},{state:'swap',label:'Swapping'},
  {state:'sorted',label:'Sorted'},{state:'pivot',label:'Pivot/Heap'},
  {state:'bucket',label:'Bucket/Digit'}
]
const LEGEND_QUICK = [
  {state:'ptrL',label:'L pointer (small side)'},{state:'ptrR',label:'R pointer (large side)'}
]

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let curKey='selection',steps=[],idx=0,playing=false,timer=null
const SPEEDS=[1200,850,600,400,270,160,90,50,25]
const SLABELS=['slowest','slow','','medium','','fast','','','fastest']

/* ══════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════ */
function treeWidth(i, heapSize, nodeW, gap){
  if(i>=heapSize) return 0
  const L=treeWidth(2*i+1,heapSize,nodeW,gap)
  const R=treeWidth(2*i+2,heapSize,nodeW,gap)
  return Math.max(nodeW, L+gap+R)
}
function escHtml(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
function renderMsdStrings(arr, hl, depth){
  const d=depth===undefined||depth===null?-1:depth
  return `<div class="msd-wrap">${arr.map((str,i)=>{
    const rowBg=COLORS[hl[i]||'default']||COLORS.default
    const chars=[...str].map((ch,j)=>{
      const isFocus=d>=0&&j===d
      const bg=isFocus?COLORS.compare:rowBg
      const cl=isFocus?' msd-ch--focus':''
      return `<span class="msd-ch${cl}" style="background:${bg}">${escHtml(ch)}</span>`
    }).join('')
    return `<div class="msd-row"><span class="msd-idx">${i}</span><div class="msd-word">${chars}</div></div>`
  }).join('')}</div>`
}

function renderHeapSvg(arr, hl, heapSize){
  if(heapSize<=0){
    return '<div class="heap-empty">Heap empty — all elements extracted.</div>'
  }
  const nodeW=34, nodeH=26, rowH=46, gap=16, pad=12
  const W=Math.max(160, treeWidth(0, heapSize, nodeW, gap)+pad*2)
  let maxD=0
  for(let i=0;i<heapSize;i++) maxD=Math.max(maxD, Math.floor(Math.log2(i+1)))
  const H=pad*2+(maxD+1)*rowH+nodeH
  const pos={}
  function place(i, x0, x1, depth){
    if(i>=heapSize) return
    const xm=(x0+x1)/2
    pos[i]={x:xm,y:pad+depth*rowH}
    place(2*i+1, x0, xm, depth+1)
    place(2*i+2, xm, x1, depth+1)
  }
  place(0, 0, W, 0)
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="heap-svg" xmlns="http://www.w3.org/2000/svg" aria-label="Binary heap">`
  const stroke='#273040'
  for(let i=0;i<heapSize;i++){
    const c1=2*i+1,c2=2*i+2
    const {x,y}=pos[i]
    if(c1<heapSize){
      const p=pos[c1]
      svg+=`<line x1="${x}" y1="${y+nodeH}" x2="${p.x}" y2="${p.y}" stroke="${stroke}" stroke-width="1.25" opacity="0.65"/>`
    }
    if(c2<heapSize){
      const p=pos[c2]
      svg+=`<line x1="${x}" y1="${y+nodeH}" x2="${p.x}" y2="${p.y}" stroke="${stroke}" stroke-width="1.25" opacity="0.65"/>`
    }
  }
  for(let i=0;i<heapSize;i++){
    const v=arr[i]
    const col=COLORS[hl[i]||'default']||COLORS.default
    const {x,y}=pos[i]
    const rx=x-nodeW/2
    svg+=`<rect x="${rx}" y="${y}" width="${nodeW}" height="${nodeH}" rx="4" fill="${col}" stroke="${stroke}" stroke-width="1"/>`
    svg+=`<text x="${x}" y="${y+17}" text-anchor="middle" fill="#e0eeff" font-size="11" font-family="JetBrains Mono,Consolas,monospace">${v}</text>`
    svg+=`<text x="${x}" y="${y-4}" text-anchor="middle" fill="#5e7a96" font-size="8" font-family="JetBrains Mono,Consolas,monospace">[${i}]</text>`
  }
  svg+='</svg>'
  return `<div class="heap-wrap">${svg}<div class="heap-caption">Max-heap as binary tree · heap fills indices <span style="color:var(--bright)">0–${heapSize-1}</span> · parent ⌊(i-1)/2⌋, children 2i+1 and 2i+2</div></div>`
}

function init(){
  const tabsEl=document.getElementById('tabs')
  tabsEl.innerHTML=Object.keys(ALGOS).map(k=>
    `<button class="tab${k===curKey?' active':''}" onclick="switchAlgo('${k}')">${ALGOS[k].name}</button>`
  ).join('')
  buildContent()
}

function buildContent(){
  const al=ALGOS[curKey]
  const legendRows=curKey==='quick'?[...LEGEND,...LEGEND_QUICK]:LEGEND
  document.getElementById('main').innerHTML=`
    <div class="badges">
      <span class="badge badge-t">⏱ ${al.time}</span>
      <span class="badge badge-s">▣ space: ${al.space}</span>
      <span class="badge ${al.stable?'badge-stb':'badge-uns'}">${al.stable?'✓ stable':'✗ unstable'}</span>
    </div>
    <div class="desc">${al.desc}</div>
    <div class="viz">
      ${curKey==='heap'?'<div class="heap-viz" id="heapViz"></div>':''}
      <div class="bars${curKey==='msd'?' bars--msd':''}" id="bars"></div>
      <div class="prog-track"><div class="prog-bar" id="prog" style="width:0"></div></div>
      <div class="step-info">
        <div class="step-msg" id="msg">Press Play or Step →</div>
        <div class="step-num" id="num"></div>
      </div>
      <div class="legend">${legendRows.map(l=>`
        <div class="lgnd-item">
          <div class="lgnd-dot" style="background:${COLORS[l.state]}"></div>
          <span>${l.label}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="controls">
      <button class="btn" onclick="doReset()">↺ Reset</button>
      <button class="btn" onclick="doBack()">‹ Back</button>
      <button class="btn play" id="playbtn" onclick="togglePlay()">▶ Play</button>
      <button class="btn" onclick="doNext()">Next ›</button>
      <div class="spd-wrap">
        <span>Speed</span>
        <input type="range" id="spd" min="1" max="9" value="4" oninput="onSpeed()">
        <span id="splab">medium</span>
      </div>
    </div>
  `
  genSteps()
}

function genSteps(){
  stopPlay()
  const al=ALGOS[curKey]
  steps=al.gen(al.arr())
  idx=0; renderStep()
}

function renderStep(){
  const bEl=document.getElementById('bars')
  const mEl=document.getElementById('msg')
  const nEl=document.getElementById('num')
  const pEl=document.getElementById('prog')
  if(!bEl) return
  const st=steps[Math.min(idx,steps.length-1)]
  const {array,hl,msg}=st
  const heapViz=document.getElementById('heapViz')
  if(heapViz){
    const hs=st.heapSize!==undefined?st.heapSize:array.length
    heapViz.innerHTML=curKey==='heap'?renderHeapSvg(array, hl, hs):''
  }
  if(curKey==='msd'){
    bEl.className='bars bars--msd'
    const dep=st.msdDepth
    bEl.innerHTML=renderMsdStrings(array, hl, dep)
  } else {
    bEl.className='bars'
    const maxV=Math.max(...array)
    bEl.innerHTML=array.map((v,i)=>{
      const col=COLORS[hl[i]||'default']||COLORS.default
      const pct=(v/maxV)*100
      return `<div class="bar" style="height:${pct}%;background:${col}">
        ${array.length<=14?`<div class="bval">${v}</div>`:''}
      </div>`
    }).join('')
  }
  if(mEl) mEl.textContent=msg
  if(nEl) nEl.textContent=`${Math.min(idx+1,steps.length)} / ${steps.length}`
  if(pEl) pEl.style.width=`${((idx+1)/steps.length)*100}%`
}

function doReset(){ genSteps() }
function doNext(){ if(idx<steps.length-1){ idx++; renderStep() } }
function doBack(){ if(idx>0){ idx--; renderStep() } }

function togglePlay(){ playing?stopPlay():startPlay() }

function startPlay(){
  if(idx>=steps.length-1) idx=0
  playing=true
  const btn=document.getElementById('playbtn')
  if(btn){ btn.textContent='⏸ Pause' }
  const delay=getDelay()
  timer=setInterval(()=>{ if(idx>=steps.length-1){ stopPlay(); return } idx++; renderStep() },delay)
}

function stopPlay(){
  playing=false; clearInterval(timer)
  const btn=document.getElementById('playbtn')
  if(btn){ btn.textContent='▶ Play' }
}

function getDelay(){
  const el=document.getElementById('spd')
  return el?SPEEDS[parseInt(el.value)-1]:400
}

function onSpeed(){
  const el=document.getElementById('spd')
  const lb=document.getElementById('splab')
  if(el && lb){ const v=parseInt(el.value)-1; lb.textContent=SLABELS[v]||'' }
  if(playing){ stopPlay(); startPlay() }
}

function switchAlgo(key){
  stopPlay(); curKey=key
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active',(t.getAttribute('onclick')||'').includes(`'${key}'`))
  })
  buildContent()
}

init()
</script>
</body>
</html>
